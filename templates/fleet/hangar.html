{% extends "base.html" %}{% block title %}Web-Hangar{% endblock %}{% block body %}<style>.m216-panel{background:#12161f;border:1px solid #2a3545;border-radius:10px;padding:20px;margin-top:16px;}.m216-btn{background:#1976d2;color:#fff;border:0;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer;}</style><section style="max-width:1000px;margin:0 auto;padding:28px 16px;color:#e3e7ed;"><h2 style="color:#d4af37;">🔧 {% if lang == "de" %}Web-Hangar{% else %}Web hangar{% endif %}</h2><p style="color:#90a4ae;">CR: <strong style="color:#00ff66;">{{ "%.0f"|format(pilot_credits) }}</strong></p><div class='m216-panel'><input id='rep-cost' type='number' value='2500'/> <button class='m216-btn' id='rep-go'>Repair</button><pre id='rep-out'></pre></div><script>document.getElementById('rep-go').onclick=function(){fetch('/api/v1/hangar/repair',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({cost_credits:Number(document.getElementById('rep-cost').value),health_after:100})}).then(r=>r.json()).then(d=>{document.getElementById('rep-out').textContent=JSON.stringify(d);});};</script></section>{% endblock %}
