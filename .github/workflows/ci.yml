name: SkyTycoon CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server deps
        run: pip install -r server_requirements.txt
      - name: Syntax check
        run: |
          python -m py_compile main.py server_backend.py Admin_Commander.py
      - name: Smoke tests (optional bcrypt)
        run: python tests/test_api_smoke.py
